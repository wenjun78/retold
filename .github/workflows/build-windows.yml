name: Build Windows app

# Builds the installer on a real Windows machine for every pull request and every push
# to main. On main it also publishes a release named after the version in package.json,
# once per version: bump the version to publish a new one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Test output goes to a file as well, so a failure can be read off the run page even
      # when the raw log is not reachable.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const log = fs.readFileSync('test.log', 'utf8').split(/\r?\n/);
            const keep = log.filter(l => /^not ok|^\s+(error|expected|actual|message|code|failureType|stack):|^\s+at .*(core\.test|page\.js|src[\\\/])|^# (pass|fail|skipped)|Error|ENOENT/.test(l)).map(l => l.slice(0, 220));
            const enc = (t) => t.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            for (let i = 0; i < Math.min(keep.length, 120); i += 30) console.log('::error title=npm test (' + (i / 30 + 1) + ')::' + enc(keep.slice(i, i + 30).join('\n')));
            if (!keep.length) console.log('::error title=npm test::' + enc(log.slice(-30).join('\n')));
          "

      - run: npm run dist

      # Drives the packaged app through a page, a web page and a clip against a mock API.
      - name: Smoke test the packaged app
        continue-on-error: true
        shell: bash
        run: |
          export RETOLD_SMOKE_BIN="$PWD/dist/win-unpacked/Retold.exe"
          export RETOLD_SMOKE_OUTDIR="$PWD/smoke-out"
          node test/smoke.js

      - name: Summarise smoke test
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            let r; try { r = JSON.parse(fs.readFileSync('smoke-out/result.json', 'utf8')); } catch { r = { ok: false, error: 'no result.json' }; }
            console.log('::notice title=Windows smoke test::' + (r.ok ? 'passed' : 'FAILED ' + String(r.error || '')) + ' | regions: ' + JSON.stringify(r.regions || []).slice(0, 300) + ' | errors: ' + JSON.stringify(r.errors || []).slice(0, 300));
          "

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: retold-windows
          path: |
            dist/*.exe
            smoke-out/
            test.log
          if-no-files-found: warn

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "v$VERSION already released"; exit 0; fi
          gh release create "v$VERSION" dist/*.exe --title "Retold $VERSION" --notes "Retold $VERSION. Download Retold-Setup to install, or the portable file to run without installing. Windows SmartScreen asks once: More info, then Run anyway."
